# dsh-efficiency 的 bundle patch —— 把插件挂进 DSH 配置树。
#
# 工作原理（与 dsh-pet 一致）：
#   - insert：往配置树里添加新的插件行（entry）
#   - id 是行标识，patch 覆盖时按它定位；name 是插件模块
#   - name: 'dsh-efficiency' 会解析包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把
#     本包扫描为「浏览器插件」，提供 /plugins/dsh-efficiency/client.js 给页面
- insert:
    - id: dsh-efficiency
      name: 'dsh-efficiency'
